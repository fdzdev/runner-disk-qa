name: Remanence windows NVMe seed

on:
  workflow_dispatch:

permissions: {}

jobs:
  seed:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Seed nonce blocks on NVMe Direct temp disk and power off
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $host_name = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Virtual Machine\Guest\Parameters').PhysicalHostNameFullyQualified
          $part0 = Get-Partition | Where-Object DriveLetter -eq 'D' | Select-Object -First 1
          if (-not $part0) { Write-Output 'no-temp-volume'; exit 0 }
          $disk = Get-Disk -Number $part0.DiskNumber
          Write-Output "TEMPDISK friendly=$($disk.FriendlyName) bus=$($disk.BusType) serial=$($disk.SerialNumber)"
          $keyType = 'serial'
          $rawId = $disk.SerialNumber
          if (-not $rawId -or ($rawId.Trim() -eq '')) { $keyType = 'uniqueid'; $rawId = $disk.UniqueId }
          if (-not $rawId -or ($rawId.Trim() -eq '')) { Write-Output 'no-disk-identity'; exit 0 }
          Write-Output "KEYTYPE $keyType"
          $serial = ($rawId -replace '[^0-9A-Za-z_]', '').Trim('_')
          $part = $part0
          $letter = $part.DriveLetter
          $partOffset = $part.Offset
          $ntfs = fsutil fsinfo ntfsinfo "${letter}:" | Out-String
          $clusterSize = [int]([regex]::Match(($ntfs -split "`n" | Select-String 'Bytes Per Cluster').ToString(), ':\s*(\d+)').Groups[1].Value)
          $dir = "${letter}:\myth-rem"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = "$dir\marker.bin"
          $nonce = -join ((48..57) + (97..102) | Get-Random -Count 24 | ForEach-Object {[char]$_})
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $payload = New-Object byte[] (32 * 4096)
          $hashes = @()
          for ($i = 0; $i -lt 32; $i++) {
            $seedBytes = [Text.Encoding]::ASCII.GetBytes("MYTHREMW|$nonce|$i")
            $block = New-Object byte[] 4096
            $h = $sha.ComputeHash($seedBytes)
            for ($j = 0; $j -lt 4096; $j += 32) { [Array]::Copy($h, 0, $block, $j, 32); $h = $sha.ComputeHash($h) }
            [Array]::Copy($block, 0, $payload, $i * 4096, 4096)
            $hashes += ([BitConverter]::ToString($sha.ComputeHash($block)) -replace '-', '').ToLower()
          }
          $fs = [System.IO.File]::Open($file, 'Create', 'ReadWrite', 'None')
          $fs.Write($payload, 0, $payload.Length); $fs.Flush($true); $fs.Close()
          $extRaw = fsutil file queryExtents $file | Out-String
          $extLine = ($extRaw -split "`n" | Select-String 'VCN').ToString()
          $lcnHex = ($extLine -split 'LCN:')[1].Trim() -split '\s' | Select-Object -First 1
          $lcn = [Convert]::ToInt64(($lcnHex -replace '^0x',''), 16)
          $byteBase = $partOffset + ($lcn * $clusterSize)
          $offsets = @(); for ($i = 0; $i -lt 32; $i++) { $offsets += ($byteBase + $i * 4096) }
          # Raw-verify first 4 blocks through the physical drive before claiming the manifest.
          $raw = [System.IO.File]::Open("\\.\PHYSICALDRIVE$($disk.Number)", 'Open', 'Read', [System.IO.FileShare]::ReadWrite)
          $ok = 0
          for ($i = 0; $i -lt 4; $i++) {
            $raw.Seek($offsets[$i], 'Begin') | Out-Null
            $buf = New-Object byte[] 4096; $raw.Read($buf, 0, 4096) | Out-Null
            $hh = ([BitConverter]::ToString($sha.ComputeHash($buf)) -replace '-', '').ToLower()
            if ($hh -eq $hashes[$i]) { $ok++ }
          }
          $raw.Close()
          $manifest = @{host=$host_name; serial=$serial; disk=$disk.Number; cluster=$clusterSize; base=$byteBase; count=32; hashes=$hashes; raw_verified=$ok; run=$env:GITHUB_RUN_ID} | ConvertTo-Json -Compress
          Write-Output "MANIFEST $manifest"
          if ($ok -eq 4) { Start-Process -FilePath shutdown -ArgumentList '/p','/f' }
          Start-Sleep -Seconds 25
          exit 0
